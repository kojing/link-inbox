<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>link-inbox に保存</title>
<link rel="stylesheet" href="style.css">
<style>
  body { width: 380px; }
  main { display: grid; gap: 12px; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; }
  .thumbs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .thumb { position: relative; flex: none; width: 84px; height: 56px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--canvas); cursor: pointer; padding: 0; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb span { position: absolute; left: 4px; bottom: 3px; font-size: 9.5px; color: #fff; background: rgba(0,0,0,.55); border-radius: 4px; padding: 0 4px; }
  .thumb.none { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px; }
  .thumb[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .thumb.none[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }
  .actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  footer { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--canvas); font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body>
<main id="setup" hidden>
  <header><h1><span class="mark" aria-hidden="true"></span>link-inbox に保存</h1></header>
  <p class="hint">最初に GitHub のリポジトリと書き込み用トークンを設定してください。</p>
  <button class="btn primary" id="openOptions">設定を開く</button>
</main>
<main id="form" hidden>
  <header>
    <h1><span class="mark" aria-hidden="true"></span>link-inbox に保存</h1>
    <button class="linkbtn" id="settings" title="設定">設定</button>
  </header>
  <label class="field">タイトル<input type="text" id="title"></label>
  <label class="field">URL<input type="text" id="url" readonly></label>
  <div class="field" style="display:grid;gap:5px;font-size:11.5px;color:var(--muted)">
    <span>画像（選ばなければ GitHub が自動で探します）</span>
    <div class="thumbs" id="thumbs" role="group" aria-label="画像を選ぶ"></div>
  </div>
  <label class="field">タグ（カンマ区切り）<input type="text" id="tags" placeholder="例: UI/モーション参考"></label>
  <div class="chips" id="recent"></div>
  <label class="field">メモ（任意）<textarea id="memo" rows="2"></textarea></label>
  <div id="msg" class="msg" hidden role="status"></div>
  <div class="actions">
    <span class="hint" id="dest"></span>
    <button class="btn primary" id="save">保存</button>
  </div>
</main>
<footer id="foot" hidden>
  <span id="queueInfo"></span>
  <button class="btn small" id="flush">未送信を再送</button>
</footer>
<script type="module" src="popup.js"></script>
</body>
</html>
