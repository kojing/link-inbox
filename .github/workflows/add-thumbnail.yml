name: Add thumbnail

# iPhone(Scriptable)から inbox/*.json が届いたら、ページの og:image などを探して
# "thumbnailUrl" を書き足す。Confluence側の「iPhoneから取込」がこの値を使う。
on:
  push:
    branches: [main]
    paths: ['inbox/*.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-thumbnail
  cancel-in-progress: false

jobs:
  enrich:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Find images
        run: |
          python3 - <<'PY'
          import json, re, html, pathlib, urllib.request
          from urllib.parse import urljoin
          from datetime import datetime, timezone

          UA = ('Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) '
                'AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1')
          MIN_SIDE = 200  # 「大きめ」とみなす幅/高さ(px)

          def attrs(tag):
              return {k.lower(): html.unescape(v1 or v2)
                      for k, v1, v2 in re.findall(r'([\w:-]+)\s*=\s*(?:"([^"]*)"|\'([^\']*)\')', tag)}

          def find_image(page_url, doc):
              metas = [attrs(m) for m in re.findall(r'<meta\b[^>]*>', doc, re.I)]
              for key in ('og:image:secure_url', 'og:image', 'og:image:url', 'twitter:image', 'twitter:image:src'):
                  for a in metas:
                      if (a.get('property') or a.get('name') or '').lower() == key and a.get('content'):
                          return urljoin(page_url, a['content'].strip())
              for l in re.findall(r'<link\b[^>]*>', doc, re.I):
                  a = attrs(l)
                  if a.get('rel', '').lower() == 'image_src' and a.get('href'):
                      return urljoin(page_url, a['href'].strip())
              best, best_area = None, 0
              for t in re.findall(r'<img\b[^>]*>', doc, re.I):
                  a = attrs(t)
                  src = a.get('src') or a.get('data-src') or ''
                  if not src or src.startswith('data:'):
                      continue
                  try:
                      w, h = int(re.sub(r'\D', '', a.get('width', '')) or 0), int(re.sub(r'\D', '', a.get('height', '')) or 0)
                  except ValueError:
                      continue
                  if w >= MIN_SIDE and h >= MIN_SIDE * 0.5 and w * h > best_area:
                      best, best_area = urljoin(page_url, src.strip()), w * h
              return best

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'text/html,*/*;q=0.8', 'Accept-Language': 'ja,en;q=0.8'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  if 'html' not in (r.headers.get('Content-Type') or 'text/html'):
                      return r.geturl(), ''
                  raw = r.read(3_000_000)
                  charset = r.headers.get_content_charset() or 'utf-8'
                  return r.geturl(), raw.decode(charset, 'replace')

          changed = 0
          for path in sorted(pathlib.Path('inbox').glob('*.json')):
              item = json.loads(path.read_text(encoding='utf-8'))
              if 'thumbnailUrl' in item or 'thumbnailCheckedAt' in item:
                  continue
              thumb = None
              try:
                  final_url, doc = fetch(item['url'])
                  thumb = find_image(final_url, doc)
              except Exception as e:
                  print(f'{path.name}: fetch failed: {e}')
              if thumb and thumb.startswith('http://'):
                  thumb = 'https://' + thumb[len('http://'):]
              if thumb and (not thumb.startswith('https://') or len(thumb) > 2048):
                  thumb = None
              if thumb:
                  item['thumbnailUrl'] = thumb
              item['thumbnailCheckedAt'] = datetime.now(timezone.utc).isoformat(timespec='seconds')
              path.write_text(json.dumps(item, ensure_ascii=False, indent=2), encoding='utf-8')
              print(f'{path.name}: {thumb or "(画像なし)"}')
              changed += 1
          print(f'updated {changed} file(s)')
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inbox
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit -m 'Add thumbnails'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
